name: Kitsune MCP
qualifiedName: kaiser-data/kitsune-mcp
description: >
  Hot-reload for MCP servers: edit your tool, reload(), call it again in the same session.
  Plus mount any community server mid-session across 7 registries, caged in Docker.
  No config edits. No client restarts.
homepage: https://github.com/kaiser-data/kitsune-mcp
license: MIT
transport: stdio

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      SMITHERY_API_KEY:
        type: string
        description: >
          Smithery API key for searching and accessing 3,000+ verified MCP servers.
          Get yours at smithery.ai/account/api-keys
        required: false
    additionalProperties: false
  commandFunction: |
    (config) => ({
      command: "python",
      args: ["server.py"],
      env: {
        ...(config.SMITHERY_API_KEY ? { SMITHERY_API_KEY: config.SMITHERY_API_KEY } : {})
      }
    })

tools:
  - name: status
    description: Show current form, connection pool, gateway scan and session stats
  - name: search
    description: Search MCP servers across 7 registries (official, MCP Registry, Glama, npm, PyPI, GitHub, Smithery)
  - name: auth
    description: Set an API key or run an OAuth 2.1 browser flow mid-session
  - name: shapeshift
    description: Mount a server's tools into the session (or drop them with no argument)
  - name: call
    description: Call a tool on the mounted server or any server by id
  - name: auto
    description: Search, mount and call in one step for a task
  - name: connect
    description: Start a persistent local MCP server process (e.g. the one you are developing)
  - name: release
    description: Stop a persistent connection and kill its process
  - name: reload
    description: Hot-reload a connected server — restart it on fresh code and remount its tools
