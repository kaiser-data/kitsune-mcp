[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitsune-mcp"
version = "0.26.0"
description = "One MCP server, every form your agent needs: hot-reload your own MCP server (edit, reload(), call again, no client restart) and test any MCP server from 6 registries in seconds, caged in Docker when available."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kitsune MCP Contributors" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "anthropic",
    "ai-agents",
    "llm-tools",
    "fastmcp",
    "mcp-server",
    "mcp-hub",
    "mcp-registry",
    "mcp-router",
    "mcp-proxy",
    "mcp-gateway",
    "hot-reload",
    "claude-code",
    "tool-use",
    "ai-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "httpcore>=1.0,<2",  # imported directly: the pinned network backend (utils._PublicOnlyBackend)
    "python-dotenv>=1.0.0",
    "mcp>=2,<3",
    "pydantic>=2.14.4,<2.15",
]

[project.optional-dependencies]
# The WebSocket transport (README's ws:// / wss:// row) imports `websockets`
# lazily and degrades with a friendly message when it is absent, so it stays
# optional. It was previously undeclared and only present by accident, as a
# transitive dependency of the unused `fastmcp` package.
ws = [
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.5.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    # Pin the formatter/linter to a minor range. `ruff format --check` is a CI
    # gate and ruff's formatting output changes between minor releases, so an
    # unbounded pin means CI formats differently from the committed tree.
    "ruff>=0.17.5,<0.18",
    # Type-check gate in CI (`mypy kitsune_mcp`); minor-pinned like ruff.
    "mypy>=2.4,<2.5",
    "respx>=0.21.0",
    # Needed so the suite actually exercises the WebSocket transport rather
    # than skipping it (tests patch `websockets.connect`).
    "websockets>=12.0",
]

[project.scripts]
kitsune-mcp = "server:main"
kitsune-forge = "server_forge:mcp.run"

[project.urls]
Homepage = "https://kaiser-data.github.io/kitsune-mcp/"
Repository = "https://github.com/kaiser-data/kitsune-mcp"
Issues = "https://github.com/kaiser-data/kitsune-mcp/issues"
Documentation = "https://kaiser-data.github.io/kitsune-mcp/"

[tool.hatch.build.targets.wheel]
# Ship ONLY the package plus the two entry-point shims. `packages = ["."]` used
# to pull the whole repo root into site-packages (tests/, docs/,
# .github/, PLAN.md, .gitignore ...) and silently made `include` a no-op.
packages = ["kitsune_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"server_forge.py" = "server_forge.py"

[tool.mypy]
python_version = "3.12"
files = ["kitsune_mcp"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Third-party packages without type information (python-dotenv ships stubs; mcp is typed).
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Per-test hang guard: any single test that blocks (real socket/subprocess with
# no timeout) is killed at 60s with a stack dump instead of hanging the runner.
# NOTE: this only covers test *execution*; a hang during collection/import is
# bounded by the `timeout -s ABRT` wrapper + `timeout-minutes` in CI.
addopts = "--timeout=60 --timeout-method=thread"
markers = [
    "network: may reach the real internet (opts out of the offline guard in conftest)",
    "real_docker: exercises a real Docker daemon (opts out of the no-host-docker fixture; gated by KITSUNE_E2E_DOCKER=1)",
]
# Dump tracebacks of all threads if a test runs longer than this (belt-and-braces).
faulthandler_timeout = 90

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.8.1,<10",
]
