[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitsune-mcp"
version = "0.21.1"
description = "The agent harness for MCP — shapeshift() into any server at runtime. 7 registries. No restart."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kitsune MCP Contributors" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "anthropic",
    "ai-agents",
    "llm-tools",
    "fastmcp",
    "mcp-server",
    "mcp-hub",
    "mcp-registry",
    "mcp-router",
    "mcp-proxy",
    "smithery",
    "tool-use",
    "ai-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    # UPPER BOUND IS LOAD-BEARING: mcp 2.x renamed the bundled FastMCP to
    # MCPServer and deleted `mcp.server.fastmcp`, which app.py/shapeshift.py
    # import. Without <2 a fresh `pip install kitsune-mcp` resolves mcp 2.x
    # and dies at import. Lift only together with the v2 migration.
    "mcp>=1.0.0,<2",
    # mcp 1.26's bundled FastMCP uses a create_model() pattern that pydantic
    # <2.10 rejects ("non-annotated attribute") and pydantic >=2.13 also rejects
    # (stricter inspect_namespace). Pin to the known-good 2.10–2.12 range.
    "pydantic>=2.10,<2.14",
]

[project.optional-dependencies]
# The WebSocket transport (README's ws:// / wss:// row) imports `websockets`
# lazily and degrades with a friendly message when it is absent, so it stays
# optional. It was previously undeclared and only present by accident, as a
# transitive dependency of the unused `fastmcp` package.
ws = [
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    # Pin the formatter/linter to a minor range. `ruff format --check` is a CI
    # gate and ruff's formatting output changes between minor releases, so an
    # unbounded pin means CI formats differently from the committed tree.
    "ruff>=0.16.6,<0.17",
    "respx>=0.21.0",
    # Needed so the suite actually exercises the WebSocket transport rather
    # than skipping it (tests patch `websockets.connect`).
    "websockets>=12.0",
]

[project.scripts]
kitsune-mcp = "server:mcp.run"
kitsune-forge = "server_forge:mcp.run"

[project.urls]
Homepage = "https://github.com/kaiser-data/kitsune-mcp"
Repository = "https://github.com/kaiser-data/kitsune-mcp"
Issues = "https://github.com/kaiser-data/kitsune-mcp/issues"
Documentation = "https://github.com/kaiser-data/kitsune-mcp/tree/main/docs"

[tool.hatch.build.targets.wheel]
# Ship ONLY the package plus the two entry-point shims. `packages = ["."]` used
# to pull the whole repo root into site-packages (tests/, docs/, evals/,
# .github/, PLAN.md, .gitignore ...) and silently made `include` a no-op.
packages = ["kitsune_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"server_forge.py" = "server_forge.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Per-test hang guard: any single test that blocks (real socket/subprocess with
# no timeout) is killed at 60s with a stack dump instead of hanging the runner.
# NOTE: this only covers test *execution*; a hang during collection/import is
# bounded by the `timeout -s ABRT` wrapper + `timeout-minutes` in CI.
addopts = "--timeout=60 --timeout-method=thread"
markers = [
    "real_docker: exercises a real Docker daemon (opts out of the no-host-docker fixture; gated by KITSUNE_E2E_DOCKER=1)",
]
# Dump tracebacks of all threads if a test runs longer than this (belt-and-braces).
faulthandler_timeout = 90
