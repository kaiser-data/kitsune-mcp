version: 2
updates:
  # "uv" (not "pip") so each PR updates pyproject.toml AND uv.lock together.
  # CI installs with `uv sync --locked` (#138), which fails on a stale lock —
  # the pip ecosystem bumped pyproject only (#133/#135 drifted until #137).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Next breaking SDK major; migrate deliberately like 1.x → 2.x (#79, #131).
      - dependency-name: "mcp"
        versions: [">=3"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
