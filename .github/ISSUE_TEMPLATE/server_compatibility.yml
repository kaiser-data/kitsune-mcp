name: Server compatibility
description: A specific MCP server doesn't work well through Kitsune
title: "[SERVER] "
labels: [server-compatibility]
body:
  - type: input
    id: server
    attributes:
      label: Server ID
      description: Exact ID as used in shapeshift() or call().
      placeholder: "@modelcontextprotocol/server-filesystem"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, HTTP + SSE, WebSocket, Docker, not sure]
  - type: textarea
    id: attempt
    attributes:
      label: How you tried to use it
      render: python
      placeholder: |
        shapeshift("server-id")
        call("tool_name", arguments={...})
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
  - type: dropdown
    id: standalone
    attributes:
      label: Does the server work when configured directly in your client?
      options: ["yes", "no", "not tried"]
  - type: input
    id: version
    attributes:
      label: Kitsune version
      placeholder: "0.22.8"
